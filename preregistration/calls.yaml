h5_quota_ledger:
  statement: >-
    After 2026-07-29 the conversion mechanism is a queue: an ADR cancellation frees
    headroom that a local->ADR converter can claim, and DR outstanding (D5) makes the
    freed-headroom balance observable.
  direction: >-
    Premium-compression episodes are preceded by headroom creation, with a lag set by
    settlement plumbing.
  threshold: TODO(ash)
  resolution_date: TODO(ash)
  resolution_criterion: TODO(ash)
  data_requirements:
    - D1   # pi, the compression target
    - D5   # DR outstanding from depositary reporting; KSD notices
    - D7   # conversion-open and earnings events
  validation_design: >-
    Role is monitor more than trade at research scale. It is the state variable that
    switches M2 between barrier-off and barrier-partial regimes, so its resolution
    criterion is about state classification, not PnL.
  confounds:
    - >-
      2026-07-29 is simultaneously Q2 earnings and conversion-open. No design in this
      repo claims to separate the two on that date; effects are reported jointly with
      the confound stated (README §5, docs/confounds.md).
  known_blockers:
    - "DR outstanding / KSD notices: source and puller design deferred to session 2."
  status: frozen_pending_signature
