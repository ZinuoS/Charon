# D7 — event calendar (README §4 D7).
#
# THIS FILE IS THE DOCUMENTED EXCEPTION TO RAW-IMMUTABILITY.
# It is hand-maintained and APPEND-ONLY: add new events at the bottom of `events:`.
# Never edit or delete an existing entry. If an event's facts change (a date moves, a
# rumour is confirmed), append a NEW entry with `supersedes: <id>` and leave the
# original in place. The record of what was believed when is itself data — a design
# that quietly rewrites the calendar destroys every event study built on it.
#
# `known_from` is the information-timing firewall applied to events (README §4): the
# date the event was publicly SCHEDULED, which is not the date it occurred. An event
# study may only condition on an event from `known_from` onward.
#
# Seeded from README §2 only. Nothing here is inferred, and no event carries a
# hypothesis parameter.

schema_version: 1
maintained_by: ash
append_only: true

