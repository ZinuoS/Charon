[project]
name = "charon"
version = "0.1.0"
description = "Pricing a one-sided arbitrage barrier: the SK Hynix (SKHY) ADR premium as a reflected process."
requires-python = "==3.12.*"
license = { text = "Apache-2.0" }

# Doctrine (README §8, Engineering): pinned exact versions, deterministic runtime.
# Any change to this list is a dated entry in docs/deviations.md.
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "pyyaml==6.0.2",
    "requests==2.32.3",
    "yfinance==0.2.51",
    "matplotlib==3.9.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
]

[build-system]
requires = ["hatchling==1.26.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "hypotheses", "execution"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.charon]
# Global determinism knobs. Referenced by pipeline.ingest._common and any future
# module that touches randomness. There is no randomness in S1 ingestion; the seed
# is declared here so S2+ has a single place to read it from.
random_seed = 20260728
